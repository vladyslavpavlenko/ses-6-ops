version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  concurrency: 4

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: none
  enable:
    - dogsled
    - dupl
    - errcheck
    - forbidigo
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - ireturn
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - predeclared
    - prealloc
    - revive
    - staticcheck
    - testpackage
    - unconvert
    - unparam
    - unused

  settings:
    dupl:
      threshold: 200

    errcheck:
      check-type-assertions: true
      check-blank: true

    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
        - pattern: ^log\.Print.*$
        - pattern: ^print.*$
        - pattern: ^spew\.Dump$

    gocritic:
      disabled-checks:
        - wrapperFunc
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - performance
        - style
        - experimental

    gocyclo:
      min-complexity: 25

    goconst:
      min-len: 2
      min-occurrences: 2

    govet:
      enable:
        - nilness
        - shadow
        - unusedwrite

    misspell:
      locale: US

    mnd:
      ignored-functions:
        - '^math\.'
        - '^http\.StatusText$'
        - '^env\.Get'

    revive:
      confidence: 0.8
      rules:
        - name: comment-spacings
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: filename-format
        - name: function-result-limit
          arguments: [3]
        - name: indent-error-flow
        - name: increment-decrement
        - name: line-length-limit
          arguments: [110]
        - name: receiver-naming
        - name: redundant-import-alias
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unexported-naming
        - name: unexported-return
        - name: unreachable-code
        - name: use-errors-new
        - name: var-naming

  exclusions:
    generated: lax
    rules:
      - linters:
          - govet
        text: 'shadow: declaration of "err" shadows declaration'
    paths:
      - docs
      - vendor
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
